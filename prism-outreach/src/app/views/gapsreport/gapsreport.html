 <main id="main" class="main" style="margin-top:50px!important;min-height:550px;">
  <section class="section dashboard">
    <div class="row">
      <div class="col-lg-12">

  <div class="card">
    <div class="card-body">

      <form [formGroup]="gapsForm" (ngSubmit)="onSearch()">

        <div class="row g-2"> 

          <div class="col-lg-2">
            <input type="text" class="form-control datepicker" formControlName="start_date">
          </div>

          <div class="col-lg-2">
            <input type="text" class="form-control datepicker" formControlName="end_date">
          </div>

          <div class="col-lg-3">
            <button type="submit" class="btn btn-primary" [disabled]="isLoading">  
                @if (!isLoading) {
                    SEARCH
                } @else {
                    <span class="spinner-border spinner-border-sm"></span>
                    Loading...
                }
            </button>
          </div>

           <div class="col-lg-5">
               <button type="submit" class="btn btn-primary" (click)="downloadCsv()">DOWNLOAD</button>
           </div>
        </div>
      </form>
    </div>
  </div>

  <div class="card mt-3">
    <div class="card-body">
       <table class="table table-striped table-hover" id="gaps">
              <thead class="table-light">
                <tr>
                  <th>MEDICAID ID</th>
                  <th>TYPE</th>
                  <th>DIAG CODE</th>
                  <th>DIAG DESC</th>
                  <th class="text-uppercase">Observation Date</th>
                  <th class="text-uppercase">Observation Year</th>
                  <th class="text-uppercase">Observation Code</th>
                  <th class="text-uppercase">CPT Modifier</th>
                  <th class="text-uppercase">Code Set</th>
                  <th class="text-uppercase">Result</th>
                  <th class="text-uppercase">Provider NPI</th>
                  <th class="text-uppercase">Taxonomy Code</th>
                  <th class="text-uppercase">Provider Name</th>
                  <th class="text-uppercase">Provider Type</th>
                  <th class="text-uppercase">RxProviderFlag</th>
                  <th class="text-uppercase">Group NPI</th>
                  <th class="text-uppercase">Group Taxonomy</th>
                  <th class="text-uppercase">Group Name</th>
                  <th class="text-uppercase">Source</th>  
                </tr>
              </thead> 
              <tbody> 
              </tbody>
            </table> 
    </div>
  </div>
</div>
</div>
</section>
</main>
