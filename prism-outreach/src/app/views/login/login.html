 
  <div class='page-section-account page-account-login loginHeader'>

    <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="assets/images/5.jpg" class="d-block w-100" alt="slide1">
    </div>
     <div class="carousel-item">

    </div>
    <div class="carousel-item">
      <img src="assets/images/2.jpg" class="d-block w-100" alt="slide2">
    </div>
    <div class="carousel-item">

        <div >
          <div id="container" style="position:relative;z-index:1;">
            <div class="loginHeaderpart"  >
              <div class="loginHeaderSubpart" style="margin-top: 60px;background-color: #fff;">
                <div align="center">
                  <img class='logo' src="assets/images/CIH-logo.png" alt="Healthcare Management" style="width: 300px;">
                    <div>DEVELOPMENT ENVIRONMENT</div>
                </div>
                
                <div class ="loginBoxMargin">
                  @if (errorMsg){
                    <div align="center" >
                      <div class="alert alert-danger">{{ errorMsg }}</div>
                    </div>
                  }
                  <div class='ddc-form-signin-options ddc-mgt-4'>
                    <div class='ddc-form-signin-main'>
                        @if (isLoading){
                          <div class="loader-container">
                            <div class="spinner"></div>
                          </div>

                        }

                      <form (ngSubmit)="loginUser()">   
                      <div class='form-group'>
                        <label>
                          <input
                            type="text"
                            [(ngModel)]="username"
                            #usernameModel="ngModel"
                            id="userName"
                            name="userName"
                            placeholder="Email or Username"
                            required
                            autocomplete="off"
                            class="input-line"
                            style="width: 400px;"
                            (input)="clearError()" />

                        </label>
                      </div>

                      <div class='form-group loginFieldMargin'  >
                        <label>
                          <input
                              type="password"
                              [(ngModel)]="password"
                              #passwordModel="ngModel"
                              id="password"
                              name="password"
                              placeholder="Password"
                              required
                              autocomplete="off"
                              class="input-line"
                              style="width: 400px;"
                              (input)="clearError()" />

                        </label>
                      </div>
                      <div>

                      <div  align="center" class="loginFieldMargin">
                          <button type="submit" name="LogIN" value="1" class="btn btn-primary" [disabled]="isLoading || !username || !password">
                            @if (isLoading){
                              <span >Please wait...</span>
                            }
                            @if (!isLoading){
                              <span >LOGIN</span>
                            }
                            
                          </button>  </div>

                    </div>

                </form>
              </div>
            </div>


        </div>
      </div>

      <div class="d-flex justify-content-center " style="margin-top:50px; text-align:center;">
        <div><img class='logo' src="assets/images/logo1.svg" alt="prism.com" style="width:60px;"></div>
        <div class="ps-4">
        <div style="font-size:24px;">Health Plan Prism</div>
        <div style="font-size:12px;color:#999;">A Karma Strategies Offering © 2025.</div>
        </div>
        </div>
      </div>
  </div>
</div>
